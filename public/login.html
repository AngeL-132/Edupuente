<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edupuente - Inicio de Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="index.html" class="back-btn">← Inicio</a>
  <div class="card">
    <div class="brand">
      <h1>Edupuente</h1>
      <p>Inicia sesión</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="Tu contraseña" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="footer">
      ¿No tienes cuenta? <a href="register.html">Regístrate</a>
    </div>
  </div>

  <script type="module" src="../src/estructura.js"></script>
</body>
</html>
